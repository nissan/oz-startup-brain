# Repository checks (#14). These are specification and design-export checks only: they establish
# no founder UX outcome, no hosted-artifact font metrics, no accessibility conformance and no owner
# design approval. They never record a scenario review; a `scenario-review` failure is a review
# task for a person (see research/synthetic-ux/tools/README.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  persona-pack:
    name: Synthetic persona pack validator and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the pack (read-only; never --record-scenario-review)
        run: python research/synthetic-ux/tools/validate_pack.py
      - name: Validator regression tests
        run: python -m unittest discover -s research/synthetic-ux/tools -p 'test_*.py' -v

  lfs-images:
    name: Raster images are stored as Git LFS pointers
    runs-on: ubuntu-latest
    steps:
      # Default checkout (no LFS download): the guard reads staged blobs and never needs image bytes.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every tracked image is an LFS pointer
        run: python scripts/check-lfs-images.py
      - name: Guard regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  source-audit:
    name: Source inventory validator, report drift and tests (#28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the manifest, rights evidence and retrieval logs (offline; no network)
        run: python data/sources/tools/source_audit.py validate
      - name: Generated inventory matches the manifest
        run: python data/sources/tools/source_audit.py report --check
      - name: Source tool regression tests
        run: python -m unittest discover -s data/sources/tools -p 'test_*.py' -v

  design-exports:
    name: Design token and renderer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: tokens.css matches tokens.json
        run: python design/tools/tokens_css.py --check
      - name: Install the documented renderer dependencies
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          npm ci --prefix design/tools
          echo "CHROME=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          echo "OSB_RENDER_NODE_MODULES=$GITHUB_WORKSPACE/design/tools/node_modules" >> "$GITHUB_ENV"
      - name: Renderer regression tests (renders to a temp dir; never commits PNGs)
        run: python -m unittest discover -s design/tools -p 'test_*.py' -v

  fixture-api:
    name: Fixture API, contracts and generated client (slice 1A-0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generated types, OpenAPI artifact and client match the code
        run: npm run check:generated
      - name: OpenAPI artifact is compatible with the frozen v1 baseline (API10)
        run: npm run check:compat
      - name: Build, then typecheck sources and tests (workspace packages resolve to built output)
        run: npm run typecheck
      - name: Tests (contracts, API, generated client)
        run: npm test
      - name: Standalone fixture client against the running API over HTTP
        run: node apps/api/scripts/demo-fixture.mjs
      - name: Dependency audit of what a deployed API would carry (non-blocking; see docs/dependency-advisories.md)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  founder-ui:
    name: "Founder journey UI (slice 1A-UI): build, BFF boundary tests and browser tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - name: Install locked dependencies (also syncs the pinned fonts into apps/web/public/fonts)
        run: npm ci
      - name: Build contracts, client, API and the Next.js app
        run: npm run build
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - name: BFF boundary tests against the real fixture API process
        run: npm test -w @ozsb/web
      - name: Browser tests (desktop and phone, both themes, harness faults, painted fonts)
        run: npm run e2e -w @ozsb/web
      - name: Keep traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: founder-ui-test-results
          path: apps/web/test-results
          retention-days: 7

