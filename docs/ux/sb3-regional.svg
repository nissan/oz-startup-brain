<text x="44" y="55" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#696258" font-weight="normal">OZ STARTUP BRAIN  /  PAPER PROTOTYPE</text>
<text x="44" y="96" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#292d31" font-weight="bold">SB3 / JESS — REGIONAL FOUNDER</text>
<text x="44" y="132" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#292d31" font-weight="normal">Goal: ask naturally on mobile and find a relevant local or remote support route.</text>
<text x="44" y="161" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#756c5f" font-weight="normal">Design proposal • Fictional examples • No program facts or live results</text>
<path d="M46 199 L696 195 L699 576 L44 580 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="64" y="230" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">1. Choose how to ask</text>
<rect x="64" y="248" width="611" height="258" rx="6" fill="white" stroke="#898b84" stroke-width="1.5"/>
<text x="81" y="284" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#292d31" font-weight="bold">What are you working on?</text>
<path d="M79 298 H658" stroke="#b3b2a8"/>
<text x="81" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Type a short question</text>
<text x="81" y="365" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">or start recording deliberately.</text>
<rect x="79" y="430" width="280" height="48" rx="5" fill="#e8eddf" stroke="#71786b"/>
<text x="91" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="bold">Type my question</text>
<rect x="372" y="430" width="280" height="48" rx="5" fill="#f8f6ee" stroke="#71786b"/>
<text x="384" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Record</text>
<text x="66" y="543" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Voice is optional; typing always works.</text>
<path d="M744 199 L1394 195 L1397 576 L742 580 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="762" y="230" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">2. Review before sending</text>
<rect x="762" y="248" width="611" height="258" rx="6" fill="white" stroke="#898b84" stroke-width="1.5"/>
<text x="779" y="284" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#292d31" font-weight="bold">Check your transcript</text>
<path d="M777 298 H1356" stroke="#b3b2a8"/>
<text x="779" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">I am building in [wrong town].</text>
<text x="779" y="365" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Edit place name: [my town]</text>
<text x="779" y="397" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Stage: working prototype</text>
<rect x="777" y="430" width="280" height="48" rx="5" fill="#e8eddf" stroke="#71786b"/>
<text x="789" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="bold">Send corrected question</text>
<rect x="1070" y="430" width="280" height="48" rx="5" fill="#f8f6ee" stroke="#71786b"/>
<text x="1082" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Cancel recording</text>
<text x="764" y="543" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Fix place names before retrieval.</text>
<path d="M46 615 L696 611 L699 992 L44 996 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="64" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">3. Find a relevant door</text>
<rect x="64" y="664" width="611" height="258" rx="6" fill="white" stroke="#898b84" stroke-width="1.5"/>
<text x="81" y="700" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#292d31" font-weight="bold">Your next support step</text>
<path d="M79 714 H658" stroke="#b3b2a8"/>
<text x="81" y="749" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Local / remote options</text>
<text x="81" y="781" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Why this fits your context</text>
<text x="81" y="813" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Coverage: shown explicitly</text>
<rect x="79" y="846" width="280" height="48" rx="5" fill="#e8eddf" stroke="#71786b"/>
<text x="91" y="876" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="bold">Open source + date</text>
<rect x="372" y="846" width="280" height="48" rx="5" fill="#f8f6ee" stroke="#71786b"/>
<text x="384" y="876" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Compare options</text>
<text x="66" y="959" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Avoid a generic national list.</text>
<path d="M744 615 L1394 611 L1397 992 L742 996 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="762" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">4. Listen or read</text>
<rect x="762" y="664" width="611" height="258" rx="6" fill="white" stroke="#898b84" stroke-width="1.5"/>
<text x="779" y="700" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#292d31" font-weight="bold">A short next-step summary</text>
<path d="M777 714 H1356" stroke="#b3b2a8"/>
<text x="779" y="749" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Read the brief summary here.</text>
<text x="779" y="781" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Full evidence stays on screen.</text>
<text x="779" y="813" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Audio: stopped by default</text>
<rect x="777" y="846" width="280" height="48" rx="5" fill="#e8eddf" stroke="#71786b"/>
<text x="789" y="876" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="bold">Read summary / Stop</text>
<rect x="1070" y="846" width="280" height="48" rx="5" fill="#f8f6ee" stroke="#71786b"/>
<text x="1082" y="876" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Export my checklist</text>
<text x="764" y="959" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Brief speech with visible sources.</text>
<text x="44" y="1050" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#292d31" font-weight="normal">Feedback: What would you do next? What is unclear? Where would you check the evidence?</text>
