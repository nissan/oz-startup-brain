<text x="384" y="876" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Why does this matter?</text>
<text x="66" y="959" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Related regimes are not interchangeable.</text>
