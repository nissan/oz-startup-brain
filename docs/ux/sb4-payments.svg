<text x="1082" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Keep as unknown</text>
<text x="764" y="543" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Do not turn uncertainty into approval.</text>
<path d="M46 615 L696 611 L699 992 L44 996 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="64" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">3. Inspect separate sources</text>
