<text x="81" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Who sends money?</text>
<text x="81" y="365" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Who holds it?</text>
<text x="81" y="397" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Who receives it?</text>
