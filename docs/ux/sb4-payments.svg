<text x="384" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="normal">Add a diagram (later)</text>
<text x="66" y="543" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#665747" font-weight="normal">Product details drive the questions.</text>
<path d="M744 199 L1394 195 L1397 576 L742 580 Z" fill="#fffdf7" stroke="#474944" stroke-width="2"/>
<text x="762" y="230" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#292d31" font-weight="bold">2. Confirm what is known</text>
