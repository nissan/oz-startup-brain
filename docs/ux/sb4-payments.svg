<text x="44" y="96" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#292d31" font-weight="bold">SB4 / SAM — PAYMENTS FOUNDER</text>
<text x="44" y="132" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#292d31" font-weight="normal">Goal: identify missing product facts and prepare a specialist conversation.</text>
<text x="44" y="161" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#756c5f" font-weight="normal">Design proposal • Fictional examples • No program facts or live results</text>
