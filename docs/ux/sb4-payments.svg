<text x="779" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Who holds customer funds?</text>
<text x="779" y="365" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">Confirmed / Unknown</text>
<text x="779" y="397" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#292d31" font-weight="normal">No permission inferred.</text>
<rect x="777" y="430" width="280" height="48" rx="5" fill="#e8eddf" stroke="#71786b"/>
<text x="789" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#292d31" font-weight="bold">Confirm a fact</text>
