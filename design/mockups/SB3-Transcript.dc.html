<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SB3 mobile 2 Review transcript</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/oz-startup-brain/tokens.css">
<link rel="stylesheet" href="ds/oz-startup-brain/components/bundle.css">
<script src="ds/oz-startup-brain/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ironbark)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--ink-muted);">
    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 999px; background: var(--border-strong);"></span>
    Recording stopped · 0:09 · audio not kept
  </div>
  <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 600;">Review before sending</h1>

  <x-import component-from-global-scope="OzStartupBrain.TranscriptReview" transcript="I am building a software startup in Toowoomba. Where should I begin?" flagged="{{flags}}"></x-import>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <p style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 700;">Your situation (set earlier)</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <x-import component-from-global-scope="OzStartupBrain.ContextChip" label="Stage" value="Working prototype"></x-import>
      <x-import component-from-global-scope="OzStartupBrain.ContextChip" label="Location" unknown="{{yes}}"></x-import>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Stage is a chip you set, not something heard in the recording. Location stays Unknown until you confirm the town above.</p>
  </div>

  <p style="margin: auto 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Fix place names before retrieval. Only the corrected text is sent.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      flags: [{ word: 'Toowoomba', reason: 'place name heard with low confidence; check the spelling' }]
    };
  }
}
</script>
</body>
</html>
