<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SB3 mobile 1 Ask</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/oz-startup-brain/tokens.css">
<link rel="stylesheet" href="ds/oz-startup-brain/components/bundle.css">
<script src="ds/oz-startup-brain/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ironbark)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 600;">What are you working on?</h1>
  <x-import component-from-global-scope="OzStartupBrain.CoverageBanner" jurisdictions="{{jurisdictions}}" corpus-version="2026.11-r1" as-of="2026-11-05"></x-import>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="q" style="font-size: 15px; line-height: 20px; font-weight: 700;">Type a short question</label>
    <textarea id="q" rows="3" placeholder="e.g. I am building a software startup in Toowoomba. Where should I begin?" style="box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--paper-raised); color: var(--ink); font-family: var(--font-sans); font-size: 17px; line-height: 26px; resize: none;"></textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <p style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 700;">or record deliberately</p>
    <button type="button" aria-label="Start recording. Recording stops only when you press stop." style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 12px 16px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--paper-raised); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 20px; font-weight: 700;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      Start recording
    </button>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">You will see the transcript and can edit it before anything is sent. Audio is not kept. Transcription provider: [TO BE DISCLOSED].</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <x-import component-from-global-scope="OzStartupBrain.StarterTask" tasks="{{tasks}}"></x-import>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Voice is optional; typing always works.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      jurisdictions: ['Federal', 'Queensland'],
      tasks: [
        { id: 'next', title: 'Find my next step', hint: 'Near me or remote' },
        { id: 'compare', title: 'Compare options', hint: 'Same criteria, dated' }
      ]
    };
  }
}
</script>
</body>
</html>
