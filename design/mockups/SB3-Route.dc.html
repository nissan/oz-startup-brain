<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SB3 mobile 3 Route and coverage</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/oz-startup-brain/tokens.css">
<link rel="stylesheet" href="ds/oz-startup-brain/components/bundle.css">
<script src="ds/oz-startup-brain/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
a{color:var(--ironbark)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 16px 20px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 600;">Your next support step</h1>
  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
    <x-import component-from-global-scope="OzStartupBrain.ContextChip" label="Location" value="Toowoomba, Qld"></x-import>
    <x-import component-from-global-scope="OzStartupBrain.ContextChip" label="Stage" value="Working prototype"></x-import>
  </div>

  <x-import component-from-global-scope="OzStartupBrain.NextStepCard" title="Ask the regional hub what it runs" why="Regional hubs are in the reviewed corpus; this one matches your location and stage." check="{{checks}}" evidence="{{evidence}}" door="Regional innovation hub (fictional fixture)"></x-import>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <x-import component-from-global-scope="OzStartupBrain.EvidenceLabel" state="outside"></x-import>
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Local council programs</span>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 22px;">Council programs for your area are not in the corpus yet, so the planner will not guess; the source directory says where to look.</p>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      checks: ['Whether you can take part remotely'],
      evidence: { state: 'checked', date: '22 July 2026', publisher: 'Hub program page (fixture)' }
    };
  }
}
</script>
</body>
</html>
